name: Skyport Systems *
description: 'Skyport Systems was a cloud infrastructure security startup, backed by GV and other
  investors, best known for SkySecure — a hyperconverged secure server appliance that enforced
  workload isolation and firewall policy in dedicated hardware for critical enterprise data-center
  workloads. Cisco acquired the company on January 24, 2018 and did not continue the standalone
  SkySecure offering, so Skyport Systems no longer operates as an independent company. Enrichment
  found no live developer surface: skyportsystems.com is a parked/for-sale domain and skyportsystems.net
  now serves an unrelated cybersecurity news aggregator. This profile is retained as a historical
  portfolio-lead record (surfaced as a GV portfolio company) with no public API, developer portal, or
  SDKs to catalog.'
